name: Trigger mxchen.github.io deploy

on:
  push:
    branches: ["master"]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on mxchen.github.io
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.DEPLOY_PAT }}" \
            https://api.github.com/repos/mxchen2001/mxchen.github.io/dispatches \
            -d '{"event_type":"mind-palace-update"}'